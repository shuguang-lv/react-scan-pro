name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Check package version
        id: package
        run: |
          package_name="$(node -p "require('./packages/scan/package.json').name")"
          package_version="$(node -p "require('./packages/scan/package.json').version")"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.package.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Build package
        if: steps.package.outputs.should_publish == 'true'
        run: pnpm --filter react-scan-pro build

      - name: Typecheck package
        if: steps.package.outputs.should_publish == 'true'
        run: pnpm --filter react-scan-pro typecheck

      - name: Test package
        if: steps.package.outputs.should_publish == 'true'
        run: pnpm --filter react-scan-pro test

      - name: Validate package
        if: steps.package.outputs.should_publish == 'true'
        run: pnpm --filter react-scan-pro publint

      - name: Publish package
        if: steps.package.outputs.should_publish == 'true'
        working-directory: packages/scan
        run: npm publish --access public

      - name: Report existing version
        if: steps.package.outputs.should_publish == 'false'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists on npm"
